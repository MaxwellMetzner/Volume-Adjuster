<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Volume Adjuster</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <main class="app-shell">
    <section class="panel panel--compact">
      <div class="topbar">
        <p class="site-label js-site-label">Loading...</p>
        <button class="icon-button js-open-settings" type="button" aria-label="Open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94a7.96 7.96 0 0 0 .05-.94 7.96 7.96 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94L14.4 2.8a.48.48 0 0 0-.49-.4h-3.82a.48.48 0 0 0-.49.4l-.36 2.52c-.58.22-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58A7.96 7.96 0 0 0 4.8 12c0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.41 1.05.72 1.63.94l.36 2.52c.05.24.25.4.49.4h3.82c.24 0 .44-.16.49-.4l.36-2.52c.58-.22 1.13-.53 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <p class="unsupported-note js-unsupported-note is-hidden">
        This page cannot be adjusted. Switch to a regular website tab.
      </p>

      <p class="attention-note js-attention-note is-hidden">
        Saved settings applied.
      </p>

      <div class="meter">
        <span class="meter__value js-volume-value">100%</span>
      </div>

      <div class="volume-controls">
        <label class="slider-wrap" for="volumeRange">
          <span class="visually-hidden">Volume</span>
          <div class="slider-frame">
            <div class="tick-strip js-tick-strip" aria-hidden="true"></div>
            <div class="anchor-marker js-anchor-marker" aria-hidden="true"></div>
            <input id="volumeRange" class="slider js-volume-range" type="range" min="0" max="1000" step="1" value="500">
          </div>
        </label>
      </div>

      <div class="mode-buttons">
        <button class="mode-button js-mono-button" type="button" aria-pressed="false">Mono</button>
        <button class="mode-button mode-button--danger js-mute-button" type="button" aria-pressed="false">Mute</button>
      </div>
    </section>

    <section class="panel js-tabs-panel">
      <div class="section-head">
        <h2>Active Tabs</h2>
        <span class="section-head__count js-audible-count">0</span>
      </div>
      <div class="tab-list js-audible-list"></div>
      <p class="empty-state js-empty-state is-hidden">No audible tabs right now.</p>
    </section>
  </main>

  <template id="audibleTabTemplate">
    <button class="tab-chip" type="button">
      <img class="tab-chip__icon" alt="">
      <span class="tab-chip__copy">
        <span class="tab-chip__site" title=""></span>
        <span class="tab-chip__status"></span>
      </span>
    </button>
  </template>

  <script type="module" src="../scripts/ui/popup.js"></script>
</body>
</html>
